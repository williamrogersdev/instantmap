name: Feature request
description: Suggest an addition or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: An API sketch or example markup helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
