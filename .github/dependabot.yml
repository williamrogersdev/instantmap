version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /worker
    schedule: { interval: weekly }
    groups:
      worker-npm:
        update-types: [minor, patch]
