name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: worker
      - name: Lint
        run: bunx oxlint packages/instantmap/src worker/src scripts bench site/src
      - name: Typecheck package
        run: bunx tsc --noEmit
        working-directory: packages/instantmap
      - name: Test package
        run: bun test
        working-directory: packages/instantmap
      - name: Test worker
        run: bun test
        working-directory: worker
      - name: Build package
        run: bun run build
        working-directory: packages/instantmap
      - name: Size budget
        run: bun run size

  e2e:
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: ./scripts/build-wasm.sh
      # Needs the wasm bindings generated by the step above.
      - name: Typecheck worker
        run: bunx tsc --noEmit
        working-directory: worker
      - name: Build package
        run: bun run build
        working-directory: packages/instantmap
      - name: Build site
        run: bun run build:site
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: bun run e2e
        env:
          E2E_OUT_DIR: ${{ github.workspace }}/verify-out
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: verify-out
          if-no-files-found: ignore

  bench:
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      # Shared runners are noisy: this is for spotting large changes, not for publishing numbers.
      - name: Benchmarks (quick)
        run: bun run bench --quick --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/latest.json
