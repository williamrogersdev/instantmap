# Publishes the npm package and creates a GitHub release when a tag like v0.2.0 is pushed.
#
# Publishes through npm Trusted Publishing (OIDC): no npm token. instantmap-js on npmjs.com trusts
# GitHub Actions, user williamrogersdev, repository instantmap, workflow release.yml, with direct
# `npm publish` allowed. Needs npm 11.5.1 or later and the id-token: write permission below.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support
        run: npm install -g npm@11.21.2 && npm --version
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./packages/instantmap/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/instantmap/package.json version $version. Bump the version, or retag."
            exit 1
          fi
      - name: Test
        run: bun test
        working-directory: packages/instantmap
      - name: Build
        run: bun run build
        working-directory: packages/instantmap
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/instantmap
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
