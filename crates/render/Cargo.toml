[package]
name = "instantmap-render"
description = "Render vector map tiles to images, fast, anywhere Rust or Wasm runs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
png = "0.18"
color_quant = "1.1"
image-webp = "0.2"
