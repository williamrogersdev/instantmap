<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austin stays</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  instant-map { display: block; position: relative; height: 520px; }
  #opened { min-height: 1.5em; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  #list button { width: 100%; text-align: left; padding: 8px 12px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; cursor: pointer; font: inherit; }
  #list button[aria-pressed="true"] { border-color: #1d4ed8; background: #eff4ff; }
</style>
</head>
<body>
<main>
  <h1>Austin stays</h1>
  <instant-map id="map" center="-97.74,30.27" zoom="13" src="https://instantmap.org"></instant-map>
  <p id="opened">Click a price to open its card.</p>
  <button type="button" id="downtown">Show downtown</button>
  <h2>Listings</h2>
  <ul id="list"></ul>
</main>
<script type="module" src="https://instantmap.org/instant-map.js"></script>
<script type="module">
  const names = ["Downtown", "East Austin", "Zilker", "Hyde Park", "Clarksville", "South Congress", "Bouldin Creek"];

  function seeded(seed) {
    let state = seed;
    return () => {
      state = (state + 0x6d2b79f5) | 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const random = seeded(75001);
  const markers = Array.from({ length: 200 }, (_, index) => {
    const price = 60 + Math.floor(random() * 240);
    const beds = 1 + Math.floor(random() * 3);
    return {
      id: index + 1,
      lng: -97.8 + random() * 0.12,
      lat: 30.23 + random() * 0.08,
      label: "$" + price,
      title: "Apartment " + (index + 1),
      subtitle: names[index % names.length] + " · " + beds + " bed" + (beds > 1 ? "s" : ""),
      href: "/listings/" + (index + 1),
    };
  });

  const map = document.getElementById("map");
  const list = document.getElementById("list");
  const opened = document.getElementById("opened");

  await customElements.whenDefined("instant-map");
  map.markers = markers;

  for (const marker of markers.slice(0, 12)) {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.id = marker.id;
    button.setAttribute("aria-pressed", "false");
    button.textContent = marker.label + " · " + marker.title;
    button.addEventListener("mouseenter", () => map.highlight(marker.id));
    button.addEventListener("mouseleave", () => map.highlight(null));
    button.addEventListener("click", () => {
      map.select(marker.id);
      map.flyTo({ center: [marker.lng, marker.lat], zoom: 15 });
    });
    item.append(button);
    list.append(item);
  }

  map.addEventListener("select", (event) => {
    const marker = event.detail.marker;
    opened.textContent = marker ? marker.title + ", " + marker.label : "Click a price to open its card.";
    for (const button of list.querySelectorAll("button")) {
      button.setAttribute("aria-pressed", String(marker !== null && String(marker.id) === button.dataset.id));
    }
  });

  document.getElementById("downtown").addEventListener("click", () => {
    map.flyTo({ center: [-97.743, 30.267], zoom: 15 });
  });
</script>
</body>
</html>
