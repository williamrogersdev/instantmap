<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Map: basic example</title>
<script type="module" src="/instant-map.js"></script>
<style>body{margin:0;font-family:system-ui}instant-map{height:100dvh}</style>
</head>
<body>
<instant-map id="map" center="-122.4194,37.7749" zoom="12" aria-label="Map of rentals in San Francisco"></instant-map>
<script type="module">
  const map = document.getElementById("map");
  let seed = 7;
  const random = () => {
    seed = (seed * 16807) % 2147483647;
    return seed / 2147483647;
  };
  const hoods = ["Mission", "SoMa", "Nob Hill", "Sunset", "Richmond", "Noe Valley", "Haight", "Marina"];
  map.markers = Array.from({ length: 400 }, (_, index) => ({
    id: index,
    lng: -122.5 + random() * 0.14,
    lat: 37.71 + random() * 0.1,
    label: `$${Math.round(150 + random() * 400)}`,
    title: `${["Sunny", "Quiet", "Modern", "Garden", "Victorian"][index % 5]} ${["loft", "flat", "studio", "suite"][index % 4]}`,
    subtitle: `${hoods[index % hoods.length]} · ${1 + (index % 3)} bed`,
    href: `#listing-${index}`,
  }));
</script>
</body>
</html>
