<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Map speed test frame</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#e9eef2}instant-map{height:100%}</style>
<script type="module" src="/instant-map.js"></script>
</head>
<body>
<instant-map id="map" aria-label="Map of San Francisco"></instant-map>
<script>
  // Loads one map from nothing and tells the parent page how long the first image took.
  const query = new URLSearchParams(location.search);
  const center = query.get("center") || "-122.4194,37.7749";
  const zoom = query.get("zoom") || "12";
  const run = query.get("run") || "";
  const map = document.getElementById("map");
  map.setAttribute("center", center);
  map.setAttribute("zoom", zoom);
  const image = document.createElement("img");
  image.alt = "Map of San Francisco";
  image.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
  image.onerror = () => parent.postMessage({ kind: "instantmap-speed", run, error: "the image did not load" }, location.origin);
  image.onload = () =>
    requestAnimationFrame(() => {
      const entry = performance.getEntriesByType("resource").find((item) => item.name.includes("/static?"));
      parent.postMessage({ kind: "instantmap-speed", run, ms: performance.now(), bytes: entry ? entry.encodedBodySize : 0, fromBrowserCache: !!entry && entry.transferSize === 0 && entry.decodedBodySize > 0 }, location.origin);
    });
  image.src = `/static?center=${encodeURIComponent(center)}&zoom=${zoom}&size=960x540${devicePixelRatio > 1 ? "&r=2" : ""}`;
  map.append(image);
</script>
</body>
</html>
